name: Galleriradar
options:
  bundleIdPrefix: no.gladesigner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Personal Team-en til Trond. Uten den mister prosjektet signeringen
    # hver gang det genereres på nytt fra denne fila.
    DEVELOPMENT_TEAM: GTJRJTH4T7
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Galleriradar:
    type: application
    platform: iOS
    sources:
      - path: Galleriradar
    dependencies:
      - target: GalleriradarWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.gladesigner.galleriradar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Galleriradar/Info.plist
      properties:
        CFBundleDisplayName: Galleriradar
        # Uten denne kjører iOS appen i 4,7-tommers modus, med svarte felt
        # over og under. En tom oppstartsskjerm er nok til å få hele flaten.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [no.gladesigner.galleriradar.hent]
        NSCalendarsWriteOnlyAccessUsageDescription: Brukes til å legge en utstilling i kalenderen din.
        ITSAppUsesNonExemptEncryption: false

  GalleriradarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GalleriradarWidget
      - path: Galleriradar/Modell.swift    # widgeten leser samme data.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.gladesigner.galleriradar.widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: GalleriradarWidget/Info.plist
      properties:
        CFBundleDisplayName: Galleriradar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
