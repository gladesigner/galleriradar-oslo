name: Galleriradar
options:
  bundleIdPrefix: no.gladesigner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Galleriradar:
    type: application
    platform: iOS
    sources:
      - path: Galleriradar
    dependencies:
      - target: GalleriradarWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.gladesigner.galleriradar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Galleriradar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Galleriradar/Info.plist
      properties:
        CFBundleDisplayName: Galleriradar
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [no.gladesigner.galleriradar.hent]
        NSCalendarsWriteOnlyAccessUsageDescription: Brukes til å legge en utstilling i kalenderen din.
        ITSAppUsesNonExemptEncryption: false

  GalleriradarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GalleriradarWidget
      - path: Galleriradar/Modell.swift    # widgeten leser samme data.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.gladesigner.galleriradar.widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: GalleriradarWidget/Info.plist
      properties:
        CFBundleDisplayName: Galleriradar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
