<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galleriradar Oslo</title>
<meta name="description" content="Hva skjer på gallerier og museer i Oslo">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Galleriradar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="ikon-192.png">
<link rel="icon" href="ikon-192.png">
<link rel="stylesheet" href="stil.css?v=2">
</head>
<body>
<header class="topp">
  <div class="topp__rad">
    <h1 class="merke"><span class="merke__prikk" aria-hidden="true"></span> Galleriradar<span class="merke__by"> Oslo</span></h1>
    <button id="oppdater" class="knapp knapp--ikon" title="Hent listen på nytt" aria-label="Hent listen på nytt">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
    </button>
  </div>

  <nav class="faner" id="faner" aria-label="Visninger">
    <button class="fane fane--valgt" data-visning="aktuelt">Nå<span class="fane__tall" data-tall="aktuelt"></span></button>
    <button class="fane" data-visning="nytt">Nytt<span class="fane__tall fane__tall--ny" id="nytt-tall"></span></button>
    <button class="fane" data-visning="kommer">Kommer<span class="fane__tall" data-tall="kommer"></span></button>
    <button class="fane" data-visning="fast">Fast<span class="fane__tall" data-tall="fast"></span></button>
    <button class="fane" data-visning="arrangement">Program<span class="fane__tall" data-tall="arrangement"></span></button>
    <button class="fane" data-visning="merket">Vil se<span class="fane__tall" data-tall="merket"></span></button>
    <button class="fane" data-visning="tidligere">Tidligere</button>
  </nav>

  <div class="sok">
    <input id="sok" type="search" placeholder="Søk etter kunstner, tittel eller galleri" autocomplete="off" aria-label="Søk">
    <select id="galleri" aria-label="Galleri"><option value="">Alle steder</option></select>
  </div>
</header>

<main id="innhold"><p class="laster">Henter utstillinger …</p></main>

<footer class="bunn">
  <span id="bunntekst">Laster …</span>
  <span class="bunn__kreditt">Appen er utviklet av Gladesigner. En bedrift opptatt av kunst og kultur siden 2007.</span>
  <span class="bunn__hoyre"><a href="kilder.html">Kilder</a></span>
</footer>

<script src="app.js?v=2"></script>
</body>
</html>
